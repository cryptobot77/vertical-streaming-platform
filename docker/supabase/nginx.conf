# nginx gateway for the sandbox Supabase stack.
#
# Exposes the Supabase API surface the app expects:
#   /auth/v1/*  -> GoTrue      (strip /auth/v1)
#   /rest/v1/*  -> PostgREST   (strip /rest/v1)
#
# The app reaches this through its own origin (Next rewrites /api/supabase/* to
# this gateway), so the browser never makes a cross-origin request and no CORS
# headers are needed here. Port 8000 is published for direct API use (curl,
# webhooks), not for browser calls.

server {
  listen 80;
  server_name _;

  location /auth/v1/ {
    proxy_pass http://auth:9999/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /rest/v1/ {
    proxy_pass http://rest:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
